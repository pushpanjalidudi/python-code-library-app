---
services:
  db:
    image: pushpanjalidudi/library:db
    deploy:
      replicas: 1
    ports:
      - "3306:3306"
    volumes:
      - mydata:/var/lib/mysql
    networks:
      - mynetwork

  auth_service:
    image: pushpanjalidudi/library:auth
    deploy:
      replicas: 3
    ports:
      - "5001:5001"
    networks:
      - mynetwork
    depends_on:
      - db

  book_service:
    image: pushpanjalidudi/library:book
    deploy:
      replicas: 3
    ports:
      - "5002:5002"
    networks:
      - mynetwork
    depends_on:
      - db

  borrow_service:
    image: pushpanjalidudi/library:borrow
    deploy:
      replicas: 3
    ports:
      - "5003:5003"
    networks:
      - mynetwork
    depends_on:
      - db

  frontend:
    image: pushpanjalidudi/library:pythonapp
    deploy:
      replicas: 3
    ports:
      - "5000:5000"
    networks:
      - mynetwork
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  mynetwork:
    driver: overlay

volumes:
  mydata:
